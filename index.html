<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DROPS SCRIPT</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif;}body{background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#050511);background-size:400% 400%;animation:gradientBG 15s ease infinite;color:#fff;min-height:100vh;overflow-x:hidden;}@keyframes gradientBG{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}#auth-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,5,17,0.95);backdrop-filter:blur(20px);z-index:99999;display:flex;justify-content:center;align-items:center;}.auth-card{background:rgba(20,20,40,0.7);border:1px solid rgba(255,255,255,0.1);padding:40px;border-radius:20px;text-align:center;width:350px;box-shadow:0 15px 35px rgba(0,0,0,0.5);backdrop-filter:blur(10px);}.auth-card h2{margin-bottom:20px;font-size:24px;background:linear-gradient(45deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.auth-card input{width:100%;padding:12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.2);border-radius:10px;color:#fff;font-size:16px;text-align:center;margin-bottom:20px;outline:none;transition:0.3s;}.auth-card input:focus{border-color:#a855f7;box-shadow:0 0 15px rgba(168,85,247,0.4);}.auth-card button{width:100%;padding:12px;background:linear-gradient(45deg,#a855f7,#6366f1);border:none;border-radius:10px;color:#fff;font-weight:bold;cursor:pointer;transition:0.3s;}.auth-card button:hover{opacity:0.9;transform:translateY(-2px);}.top-bot-widget{position:fixed;top:20px;right:20px;background:rgba(15,15,30,0.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);padding:10px 18px;border-radius:50px;display:flex;align-items:center;gap:12px;z-index:1000;box-shadow:0 5px 20px rgba(0,0,0,0.3);cursor:pointer;transition:0.3s;}.top-bot-widget:hover{border-color:#22c55e;box-shadow:0 0 20px rgba(34,197,94,0.3);}.bot-avatar-container{position:relative;width:45px;height:45px;}.bot-avatar-container img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #22c55e;box-shadow:0 0 10px rgba(34,197,94,0.5);animation:pulseGreenBorder 2s infinite;}@keyframes pulseGreenBorder{0%{border-color:#22c55e;box-shadow:0 0 5px rgba(34,197,94,0.5);}50%{border-color:#4ade80;box-shadow:0 0 15px rgba(34,197,94,0.8);}100%{border-color:#22c55e;box-shadow:0 0 5px rgba(34,197,94,0.5);}}.online-dot{position:absolute;bottom:2px;right:2px;width:12px;height:12px;background-color:#22c55e;border-radius:50%;border:2px solid #0f0f1e;animation:pulseDot 1.5s infinite;}@keyframes pulseDot{0%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(34,197,94,0.7);}70%{transform:scale(1);box-shadow:0 0 0 8px rgba(34,197,94,0);}100%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(34,197,94,0);}}.bot-info-text{display:flex;flex-direction:column;}.bot-info-name{font-size:14px;font-weight:700;color:#fff;}.bot-info-status{font-size:11px;color:#22c55e;display:flex;align-items:center;gap:4px;}.main-container{max-width:900px;margin:90px auto 40px auto;padding:20px;display:none;}.header-title{text-align:center;margin-bottom:30px;}.header-title h1{font-size:36px;font-weight:900;background:linear-gradient(45deg,#38bdf8,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 5px 15px rgba(0,0,0,0.3);}.tabs-nav{display:flex;justify-content:center;gap:15px;margin-bottom:25px;}.tab-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:12px 30px;border-radius:15px;color:#aaa;font-size:16px;font-weight:700;cursor:pointer;backdrop-filter:blur(10px);transition:0.3s;}.tab-btn.active{background:linear-gradient(135deg,rgba(168,85,247,0.3),rgba(99,102,241,0.3));border-color:#a855f7;color:#fff;box-shadow:0 0 20px rgba(168,85,247,0.3);}.tab-content{display:none;background:rgba(18,18,35,0.65);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:25px;padding:30px;box-shadow:0 20px 40px rgba(0,0,0,0.5);animation:fadeIn 0.4s ease;}.tab-content.active{display:block;}@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}.section-title{font-size:20px;margin-bottom:20px;color:#e2e8f0;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:10px;display:flex;align-items:center;gap:10px;}.form-group{margin-bottom:20px;}.form-group label{display:block;margin-bottom:8px;font-size:14px;color:#cbd5e1;}.form-control{width:100%;padding:14px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);border-radius:12px;color:#fff;font-size:14px;outline:none;transition:0.3s;}.form-control:focus{border-color:#a855f7;box-shadow:0 0 15px rgba(168,85,247,0.3);}textarea.form-control{resize:vertical;min-height:100px;}.webhook-container{display:flex;flex-direction:column;gap:10px;margin-bottom:15px;}.webhook-row{display:flex;gap:10px;}.btn-icon{background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.4);color:#f87171;padding:0 15px;border-radius:12px;cursor:pointer;transition:0.3s;}.btn-icon:hover{background:rgba(239,68,68,0.4);}.btn-add{background:rgba(34,197,94,0.2);border:1px solid rgba(34,197,94,0.4);color:#4ade80;padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:bold;display:inline-flex;align-items:center;gap:8px;transition:0.3s;}.btn-add:hover{background:rgba(34,197,94,0.4);}.btn-action{width:100%;padding:15px;background:linear-gradient(135deg,#a855f7,#6366f1);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;transition:0.3s;box-shadow:0 5px 15px rgba(168,85,247,.4);}.btn-action:hover{opacity:0.9;transform:translateY(-2px);box-shadow:0 8px 25px rgba(168,85,247,0.6);}.file-upload-box{border:2px dashed rgba(255,255,255,0.2);padding:20px;text-align:center;border-radius:12px;cursor:pointer;transition:0.3s;background:rgba(0,0,0,0.2);}.file-upload-box:hover{border-color:#a855f7;background:rgba(168,85,247,0.05);}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);z-index:2000;justify-content:center;align-items:center;}.modal-content{background:#141428;border:1px solid rgba(255,255,255,0.15);padding:30px;border-radius:20px;width:400px;box-shadow:0 20px 40px rgba(0,0,0,0.6);}.modal-header{font-size:18px;font-weight:bold;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}.close-modal{background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;}.save-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#22c55e;color:#fff;padding:12px 30px;border-radius:30px;font-weight:bold;box-shadow:0 5px 15px rgba(34,197,94,0.4);transition:0.4s;z-index:3000;}.save-toast.show{transform:translateX(-50%) translateY(0);}</style></head><body><div id="auth-overlay"><div class="auth-card"><h2>DROPS SCRIPT</h2><p style="color:#aaa;font-size:13px;margin-bottom:15px;">الرجاء إدخال كلمة المرور للمتابعة</p><input type="password" id="pass-input" placeholder="كلمة المرور"><button onclick="verifyPassword()">دخول</button></div></div><div class="top-bot-widget" onclick="openBotModal()"><div class="bot-avatar-container"><img id="widget-avatar" src="https://i.ibb.co/wNPmJ6Fq/IMG-3696.png" alt="Bot Avatar"><div class="online-dot"></div></div><div class="bot-info-text"><span class="bot-info-name" id="widget-name">DROPS SCRIPT ^ tvx</span><span class="bot-info-status"><i class="fa-solid fa-circle" style="font-size:8px;"></i> Online</span></div></div><div class="modal" id="bot-modal"><div class="modal-content"><div class="modal-header"><span>تعديل إعدادات البوت</span><button class="close-modal" onclick="closeBotModal()">&times;</button></div><div class="form-group"><label>اسم البوت الجديد:</label><input type="text" id="edit-bot-name" class="form-control" value="DROPS SCRIPT ^ tvx"></div><div class="form-group"><label>رابط صورة البوت (URL):</label><input type="text" id="edit-bot-avatar" class="form-control" value="https://i.ibb.co/wNPmJ6Fq/IMG-3696.png"></div><button class="btn-action" onclick="saveBotSettings()">حفظ التعديلات</button></div></div><div class="main-container" id="main-app"><div class="header-title"><h1>DROPS SCRIPT</h1></div><div class="tabs-nav"><button class="tab-btn active" onclick="switchTab('main-tab',this)">الرئيسية</button><button class="tab-btn" onclick="switchTab('troll-tab',this)">TROLL</button></div><div id="main-tab" class="tab-content active"><div class="section-title"><i class="fa-solid fa-paper-plane"></i> إرسال رسالة عادية للروم</div><div class="form-group"><label>رابط الويبهوك:</label><input type="text" id="main-webhook" class="form-control" value="https://discord.com/api/webhooks/1553856379146731650/iVFdsVJiopX5siegOT_bQFZC4bNi8G5iJAblkaXKNmhLD7baldxTBHa-MGmndbfbVRKK"></div><div class="form-group"><label>اكتب الرسالة:</label><textarea id="main-msg" class="form-control" placeholder="اكتب رسالتك هنا..."></textarea></div><button class="btn-action" onclick="sendMainMessage()">إرسال الرسالة</button><div class="section-title" style="margin-top:30px;"><i class="fa-solid fa-file-arrow-up"></i> إرسال ملف للروم</div><div class="form-group"><div class="file-upload-box" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-cloud-arrow-up" style="font-size:30px;color:#a855f7;margin-bottom:10px;"></i><p id="file-label-text">اضغط لاختيار ملف للإرسال</p><input type="file" id="file-input" style="display:none;" onchange="handleFileSelect(this)"></div></div><button class="btn-action" onclick="sendFileMessage()">إرسال الملف</button><div class="section-title" style="margin-top:30px;"><i class="fa-solid fa-code"></i> إرسال سكربت كملف</div><div class="form-group"><label>اسم السكربت (بدون صيغة أو معها):</label><input type="text" id="script-name" class="form-control" placeholder="مثال: ByBokaArabic"></div><div class="form-group"><label>محتوى السكربت (Luau):</label><textarea id="script-content" class="form-control" placeholder="print('Hello World')"></textarea></div><button class="btn-action" onclick="sendScriptFile()">إرسال السكربت كملف</button></div><div id="troll-tab" class="tab-content"><div class="section-title"><i class="fa-solid fa-bolt"></i> نظام السبام السريع (سرعة 999)</div><div class="form-group"><label>روابط الويب هوك (متعددة مع زر الإضافة):</label><div class="webhook-container" id="troll-webhooks-list"><div class="webhook-row"><input type="text" class="form-control troll-wh-input" value="https://discord.com/api/webhooks/1553856379146731650/iVFdsVJiopX5siegOT_bQFZC4bNi8G5iJAblkaXKNmhLD7baldxTBHa-MGmndbfbVRKK"></div></div><button class="btn-add" onclick="addWebhookRow()"><i class="fa-solid fa-plus"></i> إضافة ويبهوك آخر</button></div><div class="form-group" style="margin-top:20px;"><label>الرسالة المتكررة (تدعم التنسيق والرسائل الطويلة والإيموجيات):</label><textarea id="troll-msg" class="form-control" style="min-height:140px;">hi I’m Bot 🤖✨&#10;}&#10;loop1&#10;loop2&#10;loop3&#10;loop4&#10;loop5&#10;}&#10;🚀⚡ نظام الحماية والتفعيل السريع يعمل بكفاءة تامة!</textarea></div><button class="btn-action" style="background:linear-gradient(135deg,#ef4444,#f59e0b);" onclick="startTrollSpam()"><i class="fa-solid fa-fire"></i> بدء السبام الخارق (سرعة 999)</button></div></div><div class="save-toast" id="toast">تم حفظ التعديلات بنجاح!</div><script>const _0x4f1a=["\x31\x31\x31","\x65\x63\x36\x39\x39\x30\x33\x66\x62\x35\x66\x33\x31\x38\x33\x62\x66\x64\x63\x39\x65\x62\x33\x63\x36\x62\x65\x64\x63\x32\x30\x61"];async function sha256(message){const msgBuffer=new TextEncoder().encode(message);const hashBuffer=await crypto.subtle.digest('SHA-256',msgBuffer);const hashArray=Array.from(new Uint8Array(hashBuffer));return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');}async function verifyPassword(){const val=document.getElementById('pass-input').value;const hashed=await sha256(val);if(val===_0x4f1a[0]||hashed==="6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b"){document.getElementById('auth-overlay').style.display='none';document.getElementById('main-app').style.display='block';loadSavedData();}else{alert('كلمة المرور غير صحيحة!');document.getElementById('pass-input').value='';}}document.getElementById('pass-input').addEventListener('keypress',function(e){if(e.key==='Enter')verifyPassword();});function switchTab(tabId,btn){document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));document.getElementById(tabId).classList.add('active');btn.classList.add('active');}let botConfig={name:"DROPS SCRIPT ^ tvx",avatar:"https://i.ibb.co/wNPmJ6Fq/IMG-3696.png"};function openBotModal(){document.getElementById('bot-modal').style.display='flex';}function closeBotModal(){document.getElementById('bot-modal').style.display='none';}function saveBotSettings(){const newName=document.getElementById('edit-bot-name').value;const newAvatar=document.getElementById('edit-bot-avatar').value;if(newName)botConfig.name=newName;if(newAvatar)botConfig.avatar=newAvatar;document.getElementById('widget-name').innerText=botConfig.name;document.getElementById('widget-avatar').src=botConfig.avatar;closeBotModal();showToast();saveToLocalStorage();}function showToast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}function addWebhookRow(val=''){const container=document.getElementById('troll-webhooks-list');const row=document.createElement('div');row.className='webhook-row';row.innerHTML=`<input type="text" class="form-control troll-wh-input" value="${val}" placeholder="رابط ويبهوك جديد..."><button class="btn-icon" onclick="this.parentElement.remove(); saveToLocalStorage();"><i class="fa-solid fa-trash"></i></button>`;container.appendChild(row);}let selectedFile=null;function handleFileSelect(input){if(input.files&&input.files[0]){selectedFile=input.files[0];document.getElementById('file-label-text').innerText="تم اختيار الملف: "+selectedFile.name;}}async function sendWebhookData(webhookUrl,payload,file=null){const formData=new FormData();formData.append('payload_json',JSON.stringify({username:botConfig.name,avatar_url:botConfig.avatar,...payload}));if(file){formData.append('file',file);}try{await fetch(webhookUrl,{method:'POST',body:formData});}catch(e){console.error(e);}}async function sendMainMessage(){const wh=document.getElementById('main-webhook').value;const msg=document.getElementById('main-msg').value;if(!wh||!msg)return alert('الرجاء التأكد من كتابة الرابط والرسالة!');await sendWebhookData(wh,{content:msg});alert('تم إرسال الرسالة بنجاح!');document.getElementById('main-msg').value='';}async function sendFileMessage(){const wh=document.getElementById('main-webhook').value;if(!wh||!selectedFile)return alert('الرجاء اختيار ويبهوك وملف أولاً!');await sendWebhookData(wh,{content:"📁 **إرسال ملف جديد عبر الموقع:**"},selectedFile);alert('تم إرسال الملف بنجاح للروم!');}async function sendScriptFile(){const wh=document.getElementById('main-webhook').value;const scriptName=document.getElementById('script-name').value||"script";const scriptContent=document.getElementById('script-content').value;if(!wh||!scriptContent)return alert('الرجاء تعبئة ويبهوك ومحتوى السكربت!');const fullFileName=scriptName.endsWith('.lua')?scriptName:scriptName+'.lua';const blob=new Blob([scriptContent],{type:'text/plain'});const file=new File([blob],fullFileName,{type:'text/plain'});await sendWebhookData(wh,{content:`📜 **تم إرسال سكربت جديد:** \`${fullFileName}\``},file);alert('تم إرسال السكربت كملف بنجاح!');document.getElementById('script-content').value='';}async function startTrollSpam(){const whInputs=document.querySelectorAll('.troll-wh-input');const msg=document.getElementById('troll-msg').value;let webhooks=[];whInputs.forEach(input=>{if(input.value.trim()!=='')webhooks.push(input.value.trim());});if(webhooks.length===0||!msg)return alert('أدخل ويبهوك واحد على الأقل مع رسالة السبام!');alert('🚀 جاري إطلاق السبام السريع بلمح البصر.. اضغط موافق للبدء.');for(let i=0;i<5;i++){webhooks.forEach(wh=>{sendWebhookData(wh,{content:msg});sendWebhookData(wh,{content:msg+" \n`["+(i+1)+"]`"});});}showToast();}function saveToLocalStorage(){const data={botName:botConfig.name,botAvatar:botConfig.avatar,mainWebhook:document.getElementById('main-webhook').value,trollWebhooks:Array.from(document.querySelectorAll('.troll-wh-input')).map(i=>i.value)};localStorage.setItem('drops_script_data',JSON.stringify(data));}function loadSavedData(){const saved=localStorage.getItem('drops_script_data');if(saved){try{const data=JSON.parse(saved);if(data.botName){botConfig.name=data.botName;document.getElementById('widget-name').innerText=data.botName;document.getElementById('edit-bot-name').value=data.botName;}if(data.botAvatar){botConfig.avatar=data.botAvatar;document.getElementById('widget-avatar').src=data.botAvatar;document.getElementById('edit-bot-avatar').value=data.botAvatar;}if(data.mainWebhook){document.getElementById('main-webhook').value=data.mainWebhook;}if(data.trollWebhooks&&data.trollWebhooks.length>0){const container=document.getElementById('troll-webhooks-list');container.innerHTML='';data.trollWebhooks.forEach(wh=>addWebhookRow(wh));}}catch(e){}}}document.addEventListener('input',()=>{saveToLocalStorage();});</script></body></html>
